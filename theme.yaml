apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-cali-lite
spec:
  displayName: cali lite
  author:
    name: trizomx
    website: https://github.com/trizomx
  description: 参考 cali.so v2 风格的轻量原生 Halo 主题，含顶部毛玻璃导航。
  repo: https://github.com/trizomx/halo-cali-lite
  homepage: https://github.com/trizomx/halo-cali-lite
  issues: https://github.com/trizomx/halo-cali-lite/issues
  version: 0.2.1
  requires: ">=2.27.0"
  settingName: theme-cali-lite-setting
  configMapName: theme-cali-lite-config
  customTemplates:
    page:
      - name: 项目
        description: cali lite 项目展示页，与首页共用主题设置中的项目列表
        file: page_projects.html
  license:
    - name: MIT
