<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=|${singlePage.spec.title} · ${site.title}|, active='projects', extraHead=null)}">
<!-- Port: app/(main)/projects/page.tsx. Native Halo custom page template. -->
<main id="main" class="source-project-page mt-16 sm:mt-32">
 <header class="max-w-2xl">
  <h1 class="text-4xl font-bold tracking-tight text-zinc-800 dark:text-zinc-100 sm:text-5xl" th:text="${singlePage.spec.title}"></h1>
  <div class="source-project-intro source-prose prose dark:prose-invert mt-6 text-base text-zinc-600 dark:text-zinc-400" th:if="${not #strings.isEmpty(singlePage.content?.content)}" th:utext="${singlePage.content.content}"></div>
 </header>
 <div class="mt-16 sm:mt-20"><th:block th:replace="~{modules/source-projects :: projects(compact=false)}"></th:block></div>
</main></html>
