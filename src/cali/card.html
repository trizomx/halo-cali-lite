<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<!-- Port: app/(main)/blog/BlogPostCard.tsx. Data and equal-height fallbacks adapt to Halo. -->
<article class="source-card" th:classappend="${not #strings.isEmpty(post.spec.cover)} ? 'has-cover'" th:fragment="card(post)" th:attr="data-card-key=${post.metadata.name}"
 th:with="previewContent=${postFinder.content(post.metadata.name)}, plainText=${(previewContent?.content ?: '').replaceAll('(?is)&lt;script[^&gt;]*&gt;.*?&lt;/script&gt;|&lt;style[^&gt;]*&gt;.*?&lt;/style&gt;', '').replaceAll('&lt;[^&gt;]+&gt;', '').replaceAll('&amp;[a-zA-Z0-9#]+;', ' ').trim()}, readingMinutes=${(#strings.length(plainText) + 299) / 300}">
 <a th:href="@{${post.status.permalink}}" data-post-link class="group relative flex w-full transform-gpu flex-col rounded-3xl bg-transparent ring-2 ring-[--post-image-bg] transition-transform hover:-translate-y-0.5">
  <div data-card-cover class="relative aspect-[240/135] w-full source-card-cover">
   <img th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="@{${post.spec.cover}}" data-card-image class="rounded-t-3xl object-cover source-fill" alt="" loading="lazy" decoding="async" width="720" height="405" />
  </div>
  <span data-card-info class="source-card-info relative z-10 flex w-full flex-1 shrink-0 flex-col justify-between gap-0.5 rounded-b-[calc(1.5rem+1px)] bg-cover bg-bottom bg-no-repeat p-4 bg-blend-overlay [background-image:var(--post-image)] before:pointer-events-none before:absolute before:inset-0 before:z-10 before:select-none before:rounded-b-[calc(1.5rem-1px)] before:bg-[--post-image-bg] before:opacity-70 before:transition-opacity after:pointer-events-none after:absolute after:inset-0 after:z-10 after:select-none after:rounded-b-[calc(1.5rem-1px)] after:bg-gradient-to-b after:from-transparent after:to-[--post-image-bg] after:backdrop-blur after:transition-opacity group-hover:before:opacity-30 md:p-5">
   <h2 class="source-card-title z-20 text-base font-bold tracking-tight text-[--post-image-fg] opacity-70 transition-opacity group-hover:opacity-100 md:text-xl" th:text="${post.spec.title}" th:title="${post.spec.title}"></h2>
   <span class="source-card-meta relative z-20 flex items-center justify-between opacity-50 transition-opacity group-hover:opacity-80">
    <span class="source-card-details inline-flex items-center space-x-3">
     <time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}" class="inline-flex items-center space-x-1 text-[12px] font-medium text-[--post-image-fg] md:text-sm"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-CalendarIcon"/></svg><span th:text="${#temporals.format(post.spec.publishTime, 'yyyy/MM/dd')}"></span></time>
     <span th:if="${not #lists.isEmpty(post.categories)}" data-card-category class="source-card-category inline-flex items-center space-x-1 text-[12px] font-medium text-[--post-image-fg] md:text-sm"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-ScriptIcon"/></svg><span><th:block th:each="category, state : ${post.categories}"><span th:if="${not state.first}">, </span><span th:text="${category.spec.displayName}"></span></th:block></span></span>
    </span>
    <span class="source-card-stats inline-flex items-center space-x-3 text-[12px] font-medium text-[--post-image-fg] md:text-xs">
     <span data-card-visits th:if="${post.stats?.visit != null}" class="inline-flex items-center space-x-1" th:aria-label="|${post.stats.visit} 次浏览|"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-CursorClickIcon"/></svg><span th:text="${#numbers.formatInteger(post.stats.visit, 1, 'COMMA')}"></span></span>
     <span data-card-duration th:if="${readingMinutes > 0}" class="inline-flex items-center space-x-1" title="按正文估算的阅读时长"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-HourglassIcon"/></svg><span th:text="|约 ${readingMinutes} 分钟|"></span></span>
    </span>
   </span>
  </span>
 </a>
</article>
</body></html>
