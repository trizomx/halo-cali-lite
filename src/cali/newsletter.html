<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<!-- Port: Newsletter.tsx. Native POST to configured subscription service. -->
<section th:fragment="newsletter(position)" class="source-newsletter" th:with="action=${theme.config?.newsletter?.action ?: ''}, signup=${theme.config?.newsletter?.signup_url ?: ''}, hosted=${signup.startsWith('https://')}, ready=${not hosted and action.startsWith('https://')}">
 <form class="relative rounded-2xl border border-zinc-100 p-6 transition-opacity dark:border-zinc-700/40" th:attr="action=${ready ? action : null},data-newsletter-ready=${ready}" method="post">
  <h2 class="flex items-center text-sm font-semibold text-zinc-900 dark:text-zinc-100"><svg class="h-5 w-5 flex-none" aria-hidden="true"><use href="#cali-TiltedSendIcon"/></svg><span class="ml-2" th:text="${theme.config?.newsletter?.title ?: '动态更新'}"></span></h2>
  <p class="mt-2 text-xs text-zinc-600 dark:text-zinc-400 md:text-sm" th:text="${theme.config?.newsletter?.description ?: '喜欢这些内容的话，不妨订阅支持一下。新的记录，送到你的邮箱。'}"></p>
  <div class="mt-6 flex h-10" th:if="${not hosted}">
   <input type="email" autocomplete="email" placeholder="你的邮箱" aria-label="电子邮箱" required th:name="${theme.config?.newsletter?.email_field ?: 'email'}" th:disabled="${not ready}" class="min-w-0 flex-auto appearance-none rounded-lg border border-zinc-900/10 bg-white px-3 py-[calc(theme(spacing.2)-1px)] placeholder:text-zinc-400 focus:border-lime-500 focus:outline-none focus:ring-4 focus:ring-lime-500/10 dark:border-zinc-700 dark:bg-zinc-700/[0.15] dark:text-zinc-200 dark:placeholder:text-zinc-500 dark:focus:border-lime-400/50 dark:focus:ring-lime-400/5 sm:text-sm" />
   <button type="submit" th:disabled="${not ready}" th:text="${theme.config?.newsletter?.button_label ?: '订阅'}" class="ml-2 flex-none inline-flex items-center gap-2 justify-center rounded-lg py-2 px-3 text-sm outline-offset-2 transition active:transition-none bg-zinc-800 font-semibold text-zinc-100 hover:bg-zinc-700 active:bg-zinc-800 active:text-zinc-100/70 dark:bg-zinc-200 dark:text-black dark:hover:bg-zinc-300 dark:active:bg-zinc-300/70"></button>
  </div>
  <a th:if="${hosted}" th:href="${signup}" th:text="${theme.config?.newsletter?.button_label ?: '订阅'}" class="source-subscribe-link mt-6 inline-flex items-center gap-2 justify-center rounded-lg py-2 px-3 text-sm outline-offset-2 transition bg-zinc-800 font-semibold text-zinc-100 hover:bg-zinc-700 dark:bg-zinc-200 dark:text-black dark:hover:bg-zinc-300"></a>
  <p class="source-newsletter-status text-xs text-zinc-500" th:text="${hosted ? '前往订阅页面，确认后接收新内容。' : (ready ? '提交后前往邮件服务确认订阅。' : '邮件订阅尚未开放。')}"></p>
 </form>
</section>
</body></html>
