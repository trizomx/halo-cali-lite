apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-cali-lite-setting
spec:
  forms:
    - group: home
      label: 首页内容
      formSchema:
        - $formkit: text
          name: headline
          label: 标题第一行
          value: 记录与思考，
        - $formkit: text
          name: highlight
          label: 标题强调行
          value: 把好奇写进日常。
        - $formkit: textarea
          name: intro
          label: 简介
          help: 留空时使用 Halo 站点副标题。关于弹窗也使用此简介。
          value: ""
        - $formkit: text
          name: note
          label: 首页侧栏短句
          value: 保持好奇，慢慢记录。
        - $formkit: switch
          name: show_photos
          label: 显示文章封面照片带
          value: true
          help: 使用首页真实文章的封面，没有封面时自动隐藏。
        - $formkit: number
          name: photo_count
          label: 照片带展示数量
          value: 5
          min: 1
          max: 5
          step: 1
          validation: required|number|min:1|max:5
        - $formkit: switch
          name: show_note
          label: 显示右侧便签
          value: true
        - $formkit: text
          name: note_label
          label: 便签栏目名称
          value: 便签
        - $formkit: textarea
          name: note_description
          label: 便签补充文字
          value: ""
          help: 留空时使用站点副标题。
    - group: about
      label: 关于页面
      formSchema:
        - $formkit: switch
          name: nav_enabled
          label: 显示关于入口
          value: true
        - $formkit: switch
          name: auto_page
          label: 自动识别关于页面（推荐开启）
          value: true
          help: 在“页面”中新建并公开发布别名为 about 的页面即可；直接编辑页面正文，不再弹出简介窗口。未创建时隐藏关于入口。
        - $formkit: singlePageSelect
          name: page_name
          label: 手动指定关于页面（可留空）
          value: ""
          clearable: true
          placeholder: 留空自动识别 about 页面
          help: 页面使用其他别名时在这里选一次。正文在“页面”中编辑，可放文字、图片和链接，不与首页简介共用。
    - group: gallery
      label: 照片页面
      formSchema:
        - $formkit: switch
          name: enabled
          label: 启用照片页面内容
          value: true
          help: 只在自动识别或手动指定的照片页面展示，不影响首页照片带；按原比例瀑布流排列，点开可放大。
        - $formkit: switch
          name: auto_page
          label: 自动识别照片页面（推荐开启）
          value: true
          help: 新建并公开发布别名为 photos 的页面即可，普通默认模板也能自动显示照片与导航，无需另外选择模板。其他别名可在下方手动指定。
        - $formkit: singlePageSelect
          name: page_name
          label: 手动指定照片页面（可留空）
          clearable: true
          placeholder: 留空自动识别 photos 页面
          value: ""
          help: 通常留空即可。若页面别名不是 photos，在这里选择已公开发布的页面；无需再到页面里切换模板。照片在下方“我的照片”上传，不是在页面正文中上传。只创建页面不会自动生成照片。
        - $formkit: switch
          name: nav_enabled
          label: 显示照片导航入口
          value: true
        - $formkit: select
          name: columns
          label: 电脑端每行照片数量
          value: "3"
          options:
            - label: 2张（大图）
              value: "2"
            - label: 3张（推荐）
              value: "3"
            - label: 4张（紧凑）
              value: "4"
          help: 手机端自动每行2张。
        - $formkit: select
          name: thumb_size
          label: 照片页预览图尺寸
          value: m
          options:
            - label: 400px（更省流量）
              value: s
            - label: 800px（推荐）
              value: m
            - label: 1200px（更清晰）
              value: l
          help: 使用Halo附件缩略图，保留原图。若存储服务未提供缩略图，可给照片单独上传预览图。
        - $formkit: select
          name: load_mode
          label: 放大后的图片加载方式
          value: manual
          options:
            - label: 先看预览，手动查看原图（推荐）
              value: manual
            - label: 先看预览，再自动加载原图
              value: auto
            - label: 打开后直接加载原图
              value: original
          help: 放大策略只影响正在查看的照片；自动模式尊重省流量／2G设置。缩略图不可用时请单独上传预览图。
        - $formkit: switch
          name: show_info
          label: 放大后显示照片信息
          value: true
          help: 拍摄参数直接显示在大图正下方；在每张照片中选填，未填项隐藏，不自动读取EXIF。
        - $formkit: array
          name: items
          label: 我的照片
          value: []
          max: 100
          addLabel: 添加照片
          emptyText: 点击“添加照片”，上传一张照片即可开始。
          itemLabels:
            - type: image
              label: $value.original
            - type: text
              label: $value.title
          children:
            - $formkit: attachment
              name: original
              label: 照片原图（必填）
              value: ""
              validation: required
              help: 直接上传或从附件库选择。照片页优先使用缩略预览；没有缩略图时请在下方单独上传小尺寸预览图。
            - $formkit: attachment
              name: preview
              label: 自定义预览图（可留空）
              value: ""
              help: 留空自动使用Halo缩略图。可上传同一照片的小尺寸版本以确保省流量；不要选另一张照片。
            - $formkit: text
              name: title
              label: 照片名称（可留空）
              value: ""
              help: 仅在放大查看时展示，照片墙上不显示文字。
            - $formkit: textarea
              name: note
              label: 照片说明（可留空）
              value: ""
            - $formkit: date
              name: date
              label: 拍摄日期（可留空）
              value: ""
            - $formkit: text
              name: location
              label: 地点（可留空）
              value: ""
            - $formkit: text
              name: camera
              label: 相机或设备（可留空）
              value: ""
            - $formkit: text
              name: lens
              label: 镜头（可留空）
              value: ""
              help: 例如 FE 35mm F1.8。仅在放大后的照片下方展示，不自动解析EXIF。
            - $formkit: text
              name: focal
              label: 焦距（可留空）
              value: ""
              help: 例如 35 mm。仅在放大后的照片下方展示，不自动解析EXIF。
            - $formkit: text
              name: aperture
              label: 光圈（可留空）
              value: ""
              help: 例如 f/1.8。仅在放大后的照片下方展示，不自动解析EXIF。
            - $formkit: text
              name: shutter
              label: 快门（可留空）
              value: ""
              help: 例如 1/125 s。仅在放大后的照片下方展示，不自动解析EXIF。
            - $formkit: text
              name: iso
              label: 感光度 ISO（可留空）
              value: ""
              help: 例如 100。仅在放大后的照片下方展示，不自动解析EXIF。
            - $formkit: switch
              name: enabled
              label: 展示这张照片
              value: true
    - group: projects
      label: 项目展示
      formSchema:
        - $formkit: switch
          name: nav_enabled
          label: 顶部显示项目导航
          value: true
        - $formkit: switch
          name: home_enabled
          label: 首页右侧显示项目开发日志
          value: true
        - $formkit: text
          name: home_title
          label: 右侧项目栏目标题
          value: 开发日志
        - $formkit: number
          name: home_limit
          label: 右侧项目展示数量
          value: 3
          min: 1
          max: 12
          step: 1
          validation: required|number|min:1|max:12
        - $formkit: switch
          name: auto_page
          label: 自动识别项目页面（推荐开启）
          value: true
          help: 新建并公开发布别名为 projects 的页面即可，普通默认模板也能自动显示项目与导航，无需另外选择模板。
        - $formkit: singlePageSelect
          name: page_name
          label: 手动指定项目页面（可留空）
          help: 通常留空即可。其他别名在这里选择已公开发布的页面，不必再切换模板。项目在下方“项目列表”添加，页面正文只作为顶部简介。未找到页面时导航才回首页项目区。
          clearable: true
          placeholder: 留空自动识别 projects 页面
          value: ""
        - $formkit: array
          name: items
          label: 项目列表
          help: 首页按源码开发日志样式展示：圆图标、项目名、简介／技术、起止日期；项目页展示完整项目卡片。添加真实项目后才有内容。链接可留空，填写时用完整 HTTPS 地址。
          value: []
          addLabel: 添加项目
          itemLabels:
            - type: image
              label: $value.icon
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 项目名称
              value: ""
              validation: required
            - $formkit: textarea
              name: description
              label: 简介／技术说明
              value: ""
              help: 首页日志使用这段文字，可写 Nextjs 等技术或简短介绍；完整项目页也会展示。
            - $formkit: url
              name: url
              label: 项目链接
              value: ""
              validation: url
            - $formkit: attachment
              name: icon
              label: 图标
              value: ""
            - $formkit: text
              name: start
              label: 开始日期（可留空）
              value: ""
              help: 例如 2026/10/01；未填写时首页不显示日期，不生成假日期。
            - $formkit: text
              name: end
              label: 结束日期（可留空）
              value: ""
              help: 填写开始日期后，此项留空显示“至今”。
    - group: newsletter
      label: 邮件订阅
      formSchema:
        - $formkit: switch
          name: show_home
          label: 显示首页右侧订阅
          value: true
        - $formkit: switch
          name: show_footer
          label: 显示页脚订阅
          value: true
        - $formkit: text
          name: button_label
          label: 订阅按钮文字
          value: 订阅
        - $formkit: url
          name: signup_url
          label: 现成订阅页面地址（简单方式）
          value: ""
          help: 粘贴邮件服务提供的 HTTPS 订阅页面链接即可。填写后按钮直接前往该页面，不在本站收集邮箱。优先于下面的表单提交地址。
        - $formkit: text
          name: title
          label: 区块标题
          value: 动态更新
        - $formkit: textarea
          name: description
          label: 订阅说明
          value: 喜欢这些内容的话，不妨订阅支持一下。新的记录，送到你的邮箱。
        - $formkit: url
          name: action
          label: 订阅服务的表单提交地址
          help: 填写支持原生 HTML 表单 POST 的完整 HTTPS 地址；不要填写管理 API 或密钥。留空时两处区块仍展示，但不收集邮箱。确认邮件、退订和结果页由该服务负责。
          value: ""
        - $formkit: text
          name: email_field
          label: 邮箱字段名
          value: email
          help: 按邮件服务的表单说明填写。两处订阅表单共用同一配置。
    - group: article
      label: 文章详情
      formSchema:
        - $formkit: switch
          name: show_cover
          label: 显示文章顶部封面
          value: true
          help: 无封面时展示配色占位；关闭后直接显示文章标题和正文。
        - $formkit: switch
          name: show_toc
          label: 显示桌面左侧目录
          value: true
        - $formkit: switch
          name: show_excerpt
          label: 显示标题下的摘要
          value: true
        - $formkit: switch
          name: show_stats
          label: 显示浏览量与估算阅读时长
          value: true
        - $formkit: switch
          name: show_tools
          label: 显示桌面右侧阅读工具
          value: true
        - $formkit: switch
          name: enter_animation
          label: 文章分段入场动画
          value: true
          help: 跟随访客系统“减少动态效果”设置。
        - $formkit: switch
          name: loading
          label: 点击文章时显示加载动画
          value: true
          help: 页面加载较快时不闪现；不会改变文章链接。
    - group: appearance
      label: 背景与导航
      formSchema:
        - $formkit: switch
          name: show_grid
          label: 显示平铺背景网格
          value: true
        - $formkit: color
          name: light_background
          label: 浅色模式背景
          format: hex
          value: "#f7f8fa"
        - $formkit: color
          name: dark_background
          label: 深色模式背景
          format: hex
          value: "#17191d"
        - $formkit: color
          name: light_accent
          label: 浅色模式强调色
          format: hex
          value: "#4d7128"
        - $formkit: color
          name: dark_accent
          label: 深色模式强调色
          format: hex
          value: "#b0cf8a"
        - $formkit: number
          name: nav_font_size
          label: 桌面导航字号
          value: 14
          min: 12
          max: 18
          step: 1
          validation: required|number|min:12|max:18
          help: 手机端保留13px，避免栏目挤出屏幕。
        - $formkit: number
          name: indicator_height
          label: 导航指示线粗细
          value: 1.5
          min: 1
          max: 3
          step: 0.5
          validation: required|number|min:1|max:3
          help: 单位px，默认1.5。
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: text
          label: 页脚补充文字
          value: ""
        - $formkit: switch
          name: show_links
          label: 显示页脚导航
          value: true
        - $formkit: switch
          name: show_source
          label: 显示主题 GitHub 链接
          value: true
        - $formkit: switch
          name: show_version
          label: 显示实际主题版本号
          value: true
          help: 页脚自动显示当前安装的 cali lite 版本，更新主题时同步改变，不读取上面的补充文字。无需再手写版本号；关闭此项可隐藏。
    - group: privacy
      label: 抓取与AI使用限制
      formSchema:
        - $formkit: switch
          name: discourage_crawlers
          label: 拒绝搜索收录、AI训练与Agents采集（声明）
          value: false
          help: 开启后在主题页面添加noindex及拒绝文本挖掘、AI与Agents使用的声明。不是访问拦截，不能保证阻止采集或撤回已训练内容；根目录robots.txt与Cloudflare规则需另行设置，见开发说明“抓取限制”。关闭不撤销Halo系统已有的屏蔽设置。
