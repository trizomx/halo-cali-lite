<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=${site.title}, active='home', extraHead=null)}">
<main id="main">
  <section class="hero">
    <div class="hero-avatar" data-home-avatar-anchor>
      <span class="site-avatar" data-site-avatar>
        <img th:if="${not #strings.isEmpty(site.logo)}" th:src="@{${site.logo}}" alt="" width="70" height="70" />
        <span th:if="${#strings.isEmpty(site.logo)}" class="avatar-mark" aria-hidden="true">✳</span>
      </span>
    </div>
    <span class="eyebrow" th:text="#{hero.eyebrow}"></span>
    <h1><span th:text="${theme.config?.home?.headline ?: '记录与思考，'}"></span><br /><span class="highlight" th:text="${theme.config?.home?.highlight ?: '把好奇写进日常。'}"></span></h1>
    <p class="hero-intro" th:text="${theme.config?.home?.intro ?: site.subtitle ?: ''}"></p>
    <div class="hero-links"><a class="text-link" th:href="@{${site.routes.archivesUri}}"><span th:text="#{hero.read}"></span><span aria-hidden="true">↗</span></a><span class="link-dot">·</span><button type="button" class="text-link" data-about-open th:text="#{nav.about}"></button></div>
  </section>
  <th:block th:replace="~{modules/gallery :: gallery}"></th:block>
  <div class="filmstrip" th:if="${theme.config?.home?.show_photos != false and not #lists.isEmpty(posts.items) and not (theme.config?.gallery?.enabled != false and theme.config?.gallery?.replace_cover_strip != false and theme.config?.gallery?.items != null and not #lists.isEmpty(theme.config.gallery.items))}" th:with="photoCount=${theme.config?.home?.photo_count ?: 5}" th:aria-label="#{photos.label}">
    <th:block th:each="post, state : ${posts.items}">
      <a class="film-photo" th:if="${state.index < photoCount and not #strings.isEmpty(post.spec.cover)}" th:href="@{${post.status.permalink}}" th:aria-label="${post.spec.title}"><img th:src="@{${post.spec.cover}}" alt="" loading="lazy" width="320" height="380" /></a>
    </th:block>
  </div>
  <div class="home-content">
    <section class="home-writing">
      <div class="section-heading"><h2><svg width="20" height="20" aria-hidden="true"><use href="#cali-PencilSwooshIcon"/></svg><span th:text="#{recent}"></span></h2><a class="text-link" th:href="@{${site.routes.archivesUri}}" th:text="#{all.posts}"></a></div>
      <section th:replace="~{modules/posts :: homeList(posts=${posts})}"></section>
    </section>
    <aside class="home-aside">
      <section class="note-card" th:if="${theme.config?.home?.show_note != false}"><span class="note-star" aria-hidden="true">✳</span><span class="eyebrow" th:text="${theme.config?.home?.note_label ?: '便签'}"></span><h2 th:text="${theme.config?.home?.note ?: '保持好奇，慢慢记录。'}"></h2><p th:text="${theme.config?.home?.note_description ?: site.subtitle}"></p></section>
      <th:block th:if="${theme.config?.newsletter?.show_home != false}"><th:block th:replace="~{modules/source-newsletter :: newsletter(position='home')}"></th:block></th:block>
      <section id="projects" class="home-projects" th:if="${theme.config?.projects?.home_enabled != false}">
        <div class="section-heading"><h2 th:text="${theme.config?.projects?.home_title ?: '我的项目'}"></h2><a class="text-link" th:href="@{${projectsUrl}}">查看全部 ↗</a></div>
        <th:block th:replace="~{modules/source-projects :: projects(compact=true)}"></th:block>
      </section>
    </aside>
  </div>

</main>
</html>
