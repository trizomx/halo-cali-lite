<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=#{nav.categories} + ' · ' + ${site.title}, active='categories', extraHead=null)}">
