<!-- Generated by scripts/build-source.py; edit src/cali/post.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=|${post.spec.title} · ${site.title}|, active='writing', extraHead=~{::imageHead})}">
<th:block th:fragment="imageHead">
 <title th:text="|${post.spec.title} · ${site.title}|"></title>
 <th:block th:if="${theme.config?.article?.image_zoom != false}">
  <link rel="stylesheet" th:href="@{/assets/gallery.css(v=${theme.spec.version})}" />
  <script defer th:src="@{/assets/article-images.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/gallery.js(v=${theme.spec.version})}"></script>
 </th:block>
</th:block>
<!-- Port: BlogPostPage.tsx + BlogPostTableOfContents.tsx; body is Halo-rendered HTML. -->
<main id="main" class="source-post mt-16 lg:mt-32"
 th:with="plainText=${(post.content?.content ?: '').replaceAll('(?is)&lt;script[^&gt;]*&gt;.*?&lt;/script&gt;|&lt;style[^&gt;]*&gt;.*?&lt;/style&gt;', '').replaceAll('&lt;[^&gt;]+&gt;', '').replaceAll('&amp;[a-zA-Z0-9#]+;', ' ').trim()}, readingMinutes=${(#strings.length(plainText) + 299) / 300}">
 <div class="w-full md:flex md:justify-between xl:relative">
  <aside class="source-toc-rail">
   <!-- Article map port: cali.so v3 components/post-toc.tsx; native Halo adapter. -->
   <div th:if="${theme.config?.article?.show_toc != false or theme.config?.article?.mobile_toc != false}" class="source-map-root" data-toc hidden>
    <div class="source-map-island" data-toc-island>
     <button type="button" class="source-map-toggle" data-toc-toggle aria-controls="cali-article-map" aria-expanded="true" aria-label="收起文章地图">
      <svg class="source-map-progress" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle class="source-map-track" cx="12" cy="12" r="10"/><circle class="source-map-value" cx="12" cy="12" r="10" pathLength="1" stroke-dasharray="0 1" data-toc-progress/></svg>
      <svg class="source-map-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3"><rect x=".75" y="1.75" width="10.5" height="8.5" rx="2"/><path d="M4.5 2v8M8 4.5 6.5 6 8 7.5"/></svg>
      <span class="source-map-current" data-toc-current>文章地图</span><span class="source-map-percent" data-toc-percent>0%</span><svg class="source-map-chevron" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>
     </button>
     <nav id="cali-article-map" class="source-map-panel" data-toc-panel th:aria-label="#{toc}">
      <a class="source-map-utility" th:href="@{${site.routes.archivesUri}}">↵ 文章</a>
      <ul data-toc-list class="source-toc-list"></ul>
      <button type="button" class="source-map-utility" data-toc-top>↑ 顶部</button>
     </nav>
    </div>
   </div>
  </aside>
  <div class="max-w-2xl md:flex-1 md:shrink-0 source-post-column">
   <a th:href="@{${site.routes.archivesUri}}" th:aria-label="#{back.writing}" class="source-back group mb-8 flex h-10 w-10 items-center justify-center rounded-full bg-white shadow-md shadow-zinc-800/5 ring-1 ring-zinc-900/5 transition dark:border dark:border-zinc-700/50 dark:bg-zinc-800 dark:ring-0 dark:ring-white/10 dark:hover:border-zinc-700 dark:hover:ring-white/20 lg:absolute lg:-left-5 lg:-mt-2 lg:mb-0 xl:-top-1.5 xl:left-0 xl:mt-0"><svg class="h-8 w-8 stroke-zinc-500 transition group-hover:stroke-zinc-700 dark:stroke-zinc-500 dark:group-hover:stroke-zinc-400" aria-hidden="true"><use href="#cali-UTurnLeftIcon"/></svg></a>
   <article data-post-detail class="source-post-article" th:attr="data-postid=${post.metadata.name},data-card-key=${post.metadata.name},data-entry-animation=${theme.config?.article?.enter_animation != false},data-mobile-toc=${theme.config?.article?.mobile_toc != false},data-desktop-toc=${theme.config?.article?.show_toc != false}">
    <header class="relative flex flex-col items-center pb-5 after:absolute after:-bottom-1 after:block after:h-px after:w-full after:rounded after:bg-gradient-to-r after:from-zinc-400/20 after:via-zinc-200/10 after:to-transparent dark:after:from-zinc-600/20 dark:after:via-zinc-700/10">
     <div th:if="${theme.config?.article?.show_cover != false}" class="source-post-cover relative mb-7 aspect-[240/135] w-full md:mb-12 md:w-[120%]" data-reveal="cover">
      <div th:if="${not #strings.isEmpty(post.spec.cover)}" data-card-backdrop class="absolute z-0 hidden aspect-[240/135] w-full blur-xl saturate-150 after:absolute after:inset-0 after:hidden after:bg-white/50 dark:after:bg-black/50 md:block md:after:block"><img th:src="@{${post.spec.cover}}" class="select-none source-fill" alt="" aria-hidden="true" width="1200" height="675" /></div>
      <img th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="@{${post.spec.cover}}" th:alt="${post.spec.title}" data-card-image class="source-fill select-none rounded-2xl ring-1 ring-zinc-900/5 transition dark:ring-0 dark:ring-white/10 dark:hover:border-zinc-700 dark:hover:ring-white/20 md:rounded-3xl" decoding="async" fetchpriority="high" width="1200" height="675" />
     </div>
     <div data-reveal="meta" class="flex w-full items-center space-x-4 text-sm font-medium text-zinc-600/80 dark:text-zinc-400/80">
      <time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}" class="flex items-center space-x-1.5"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-CalendarIcon"/></svg><span th:text="${#temporals.format(post.spec.publishTime, 'yyyy/MM/dd')}"></span></time>
      <span th:if="${not #lists.isEmpty(post.categories)}" class="inline-flex items-center space-x-1.5 source-post-categories"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-ScriptIcon"/></svg><span><th:block th:each="category, state : ${post.categories}"><span th:if="${not state.first}">, </span><a th:href="@{${category.status.permalink}}" th:text="${category.spec.displayName}"></a></th:block></span></span>
     </div>
     <h1 data-reveal="title" class="mt-6 w-full text-4xl font-bold tracking-tight text-zinc-800 dark:text-zinc-100 sm:text-5xl" th:text="${post.spec.title}"></h1>
     <p data-reveal="summary" class="my-5 w-full text-sm font-medium text-zinc-500" th:if="${theme.config?.article?.show_excerpt != false and not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}"></p>
     <div th:if="${theme.config?.article?.show_stats != false}" data-reveal="stats" class="source-post-stats flex w-full items-center space-x-4 text-sm font-medium text-zinc-700/50 dark:text-zinc-300/50">
      <span th:if="${post.stats?.visit != null}" class="inline-flex items-center space-x-1.5"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-CursorClickIcon"/></svg><span th:text="|${#numbers.formatInteger(post.stats.visit, 1, 'COMMA')} 次点击|"></span></span>
      <span th:if="${readingMinutes > 0}" class="inline-flex items-center space-x-1.5"><svg width="1em" height="1em" aria-hidden="true"><use href="#cali-HourglassIcon"/></svg><span th:text="|约 ${readingMinutes} 分钟阅读|"></span></span>
     </div>
    </header>
    <div class="article-body source-prose prose dark:prose-invert mt-8" th:utext="${post.content?.content ?: ''}"></div>
    <section class="article-image-viewer" data-gallery data-viewer-kind="article" data-load-mode="original" th:if="${theme.config?.article?.image_zoom != false}" aria-label="正文图片查看器">
     <th:block th:replace="~{modules/image-viewer :: viewer(showInfo=true)}"></th:block>
    </section>
    <footer class="source-post-tags" th:if="${not #lists.isEmpty(post.tags)}"><a th:each="tag : ${post.tags}" th:href="@{${tag.status.permalink}}" th:text="|# ${tag.spec.displayName}|"></a></footer>
   </article>
  </div>
  <aside class="hidden w-[90px] shrink-0 lg:block"><div class="sticky top-2 flex justify-end pt-20"><div class="source-reading-tools" th:if="${theme.config?.article?.show_tools != false}">
   <span class="source-reading-progress" data-reading-progress aria-label="阅读进度">0%</span>
   <button type="button" data-copy-post aria-label="复制文章链接" title="复制文章链接">↗</button>
   <button type="button" data-post-top aria-label="回到文章顶部" title="回到顶部">↑</button>
  </div></div></aside>
 </div>
</main></html>
