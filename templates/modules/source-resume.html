<!-- Generated by scripts/build-source.py; edit src/cali/resume.html -->
<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<!-- Port: app/(main)/Resume.tsx. User's project log uses the same settings items
     as the full projects page. Original schema fields mapped in sources.json. -->
<div th:fragment="resume" class="source-resume rounded-2xl border border-zinc-100 p-6 dark:border-zinc-700/40" th:with="items=${theme.config?.projects?.items}, homeLimit=${theme.config?.projects?.home_limit ?: 3}">
 <div class="source-resume-heading">
  <h2 class="flex items-center text-sm font-semibold text-zinc-900 dark:text-zinc-100"><svg class="h-5 w-5 flex-none" aria-hidden="true"><use href="#cali-BriefcaseIcon"/></svg><span class="ml-2" th:text="${theme.config?.projects?.home_title ?: '开发日志'}"></span></h2>
  <a class="source-resume-all" th:if="${projectsReady}" th:href="@{${projectsUrl}}" aria-label="查看全部项目">↗</a>
 </div>
 <ol class="mt-6 space-y-4" th:if="${items != null and not #lists.isEmpty(items)}">
  <th:block th:each="project, state : ${items}">
   <li class="flex gap-4" th:if="${state.index < homeLimit and not #strings.isEmpty(project.name)}">
    <div class="relative mt-1 flex h-10 w-10 flex-none items-center justify-center rounded-full shadow-md shadow-zinc-800/5 ring-1 ring-zinc-900/5 dark:border dark:border-zinc-700/50 dark:bg-zinc-800 dark:ring-0">
     <img th:if="${not #strings.isEmpty(project.icon) and (project.icon.startsWith('https://') or (project.icon.startsWith('/') and not project.icon.startsWith('//')))}" th:src="@{${project.icon}}" alt="" class="h-8 w-8 rounded-full" width="32" height="32" loading="lazy" decoding="async" />
     <span class="source-project-initial" th:unless="${not #strings.isEmpty(project.icon) and (project.icon.startsWith('https://') or (project.icon.startsWith('/') and not project.icon.startsWith('//')))}" aria-hidden="true" th:text="${#strings.substring(project.name,0,1)}"></span>
    </div>
    <dl class="flex flex-auto flex-wrap gap-x-2">
     <dt class="sr-only">项目</dt>
     <dd class="w-full flex-none text-sm font-medium text-zinc-900 dark:text-zinc-100">
      <a th:if="${not #strings.isEmpty(project.url) and project.url.startsWith('https://')}" th:href="${project.url}" target="_blank" rel="noopener noreferrer" th:text="${project.name}"></a>
      <span th:unless="${not #strings.isEmpty(project.url) and project.url.startsWith('https://')}" th:text="${project.name}"></span>
     </dd>
     <dt class="sr-only">说明</dt>
     <dd class="source-resume-description text-xs text-zinc-500 dark:text-zinc-400" th:text="${project.description ?: ''}"></dd>
     <th:block th:if="${not #strings.isEmpty(project.start)}">
      <dt class="sr-only">日期</dt>
      <dd class="source-resume-dates ml-auto text-xs text-zinc-500/80 dark:text-zinc-400/80"><span th:text="${project.start}"></span><span aria-hidden="true">—</span><span th:text="${#strings.isEmpty(project.end) ? '至今' : project.end}"></span></dd>
     </th:block>
    </dl>
   </li>
  </th:block>
 </ol>
 <p class="source-project-empty text-sm text-zinc-500" th:if="${items == null or #lists.isEmpty(items)}">项目正在整理中。</p>
</div></body></html>
