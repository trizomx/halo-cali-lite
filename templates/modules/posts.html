<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="homeList(posts)" class="posts-list home-posts">
  <div class="home-post-stack" th:if="${not #lists.isEmpty(posts.items)}">
    <article class="post-card home-post-card" th:each="post : ${posts.items}"
             th:with="previewContent=${postFinder.content(post.metadata.name)}, plainText=${(previewContent?.content ?: '').replaceAll('(?is)&lt;script[^&gt;]*&gt;.*?&lt;/script&gt;|&lt;style[^&gt;]*&gt;.*?&lt;/style&gt;', '').replaceAll('&lt;[^&gt;]+&gt;', '').replaceAll('&amp;[a-zA-Z0-9#]+;', ' ').trim()}, readingMinutes=${(#strings.length(plainText) + 299) / 300}">
      <a class="home-post-link" th:href="@{${post.status.permalink}}">
        <div class="home-post-cover" th:if="${not #strings.isEmpty(post.spec.cover)}">
          <img loading="lazy" decoding="async" th:src="@{${post.spec.cover}}" alt="" width="720" height="405" />
        </div>
        <div class="home-post-info">
          <div class="home-post-backdrop" th:if="${not #strings.isEmpty(post.spec.cover)}" aria-hidden="true">
            <img loading="lazy" decoding="async" th:src="@{${post.spec.cover}}" alt="" width="720" height="405" />
          </div>
          <div class="home-post-text">
            <h2 th:text="${post.spec.title}"></h2>
            <p class="home-post-excerpt" th:if="${not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}"></p>
            <div class="home-post-meta">
              <div class="home-post-details">
              <time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16"/></svg><span th:text="${#temporals.format(post.spec.publishTime, 'yyyy/MM/dd')}"></span></time>
              <span class="home-post-category" th:if="${not #lists.isEmpty(post.categories)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h9l7 7-9 9-7-7Z"/><circle cx="9" cy="9" r="1"/></svg><span><th:block th:each="category, state : ${post.categories}"><span th:if="${not state.first}" aria-hidden="true">，</span><span th:text="${category.spec.displayName}"></span></th:block></span></span>
              </div>
              <div class="home-post-stats">
                <span class="home-post-stat home-post-visits" th:if="${post.stats?.visit != null}" th:aria-label="|${post.stats.visit} 次浏览|" title="浏览量"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><span th:text="${#numbers.formatInteger(post.stats.visit, 1, 'COMMA')}"></span></span>
                <span class="home-post-stat home-post-duration" th:if="${readingMinutes > 0}" title="按正文长度估算的阅读时长"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v4l5 5-5 5v4m10-18v4l-5 5 5 5v4"/></svg><span th:text="|约 ${readingMinutes} 分钟|"></span></span>
              </div>
            </div>
          </div>
        </div>
      </a>
    </article>
  </div>
  <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}"><span class="empty-symbol" aria-hidden="true">✳</span><h2 th:text="#{empty.posts}"></h2><p th:text="#{empty.posts.note}"></p></div>
  <nav th:replace="~{modules/posts :: pagination(result=${posts})}"></nav>
</section>
<section th:fragment="list(posts)" class="posts-list">
  <div class="post-grid" th:if="${not #lists.isEmpty(posts.items)}">
    <article class="post-card" th:each="post : ${posts.items}">
      <a class="post-cover" th:if="${not #strings.isEmpty(post.spec.cover)}" th:href="@{${post.status.permalink}}" tabindex="-1" aria-hidden="true">
        <img loading="lazy" decoding="async" th:src="@{${post.spec.cover}}" alt="" width="720" height="450" />
      </a>
      <div class="post-meta">
        <time th:if="${post.spec.publishTime != null}" th:datetime="${post.spec.publishTime}" th:text="${#temporals.format(post.spec.publishTime, 'yyyy / MM / dd')}"></time>
        <span th:if="${not #lists.isEmpty(post.categories)}" th:text="${post.categories[0].spec.displayName}"></span>
      </div>
      <h2><a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a></h2>
      <p class="post-excerpt" th:if="${not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}"></p>
      <a class="read-link" th:href="@{${post.status.permalink}}" th:aria-label="|#{read} ${post.spec.title}|"><span th:text="#{read}"></span><span aria-hidden="true">↗</span></a>
    </article>
  </div>
  <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}"><span class="empty-symbol" aria-hidden="true">✳</span><h2 th:text="#{empty.posts}"></h2><p th:text="#{empty.posts.note}"></p></div>
  <nav th:replace="~{modules/posts :: pagination(result=${posts})}"></nav>
</section>
<nav class="pagination" th:fragment="pagination(result)" th:if="${result.hasPrevious() or result.hasNext()}" th:aria-label="#{pagination.label}">
  <a class="pill-button" th:if="${result.hasPrevious()}" th:href="@{${result.prevUrl}}" th:text="#{pagination.prev}"></a>
  <span th:text="|${result.page} / ${result.totalPages}|"></span>
  <a class="pill-button" th:if="${result.hasNext()}" th:href="@{${result.nextUrl}}" th:text="#{pagination.next}"></a>
</nav>
</body></html>
