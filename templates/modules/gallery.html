<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<!-- Native Halo feature, independently developed for this theme. No article data. -->
<section th:fragment="gallery" class="photo-wall" aria-label="照片墙" data-gallery
 th:if="${theme.config?.gallery?.enabled != false and theme.config?.gallery?.items != null and not #lists.isEmpty(theme.config.gallery.items)}"
 th:with="items=${theme.config.gallery.items}, limit=${theme.config?.gallery?.limit ?: 12}, thumbSize=${theme.config?.gallery?.thumb_size == 's' ? 's' : (theme.config?.gallery?.thumb_size == 'l' ? 'l' : 'm')}"
 th:attr="data-columns=${theme.config?.gallery?.columns ?: '3'},data-load-mode=${theme.config?.gallery?.load_mode ?: 'manual'}">
 <div class="photo-wall-grid">
  <th:block th:each="photo, state : ${items}">
   <th:block th:if="${state.index < limit and photo.enabled != false and not #strings.isEmpty(photo.original) and (photo.original.startsWith('https://') or (photo.original.startsWith('/') and not photo.original.startsWith('//')))}">
    <a class="photo-wall-item" data-gallery-item target="_blank" rel="noopener noreferrer" th:href="@{${photo.original}}"
     th:with="custom=${not #strings.isEmpty(photo.preview) and (photo.preview.startsWith('https://') or (photo.preview.startsWith('/') and not photo.preview.startsWith('//')))}, thumb=${custom ? photo.preview : (thumbnail.gen(photo.original, thumbSize) ?: photo.original)}, large=${custom ? photo.preview : (thumbnail.gen(photo.original, 'l') ?: thumb)}"
     th:attr="data-original=@{${photo.original}},data-preview=@{${large}},data-photo-title=${photo.title ?: ''},data-photo-note=${photo.note ?: ''},data-photo-date=${photo.date ?: ''},data-photo-location=${photo.location ?: ''},data-photo-camera=${photo.camera ?: ''}"
     th:aria-label="${#strings.isEmpty(photo.title) ? '放大查看照片 ' + state.count : '放大查看：' + photo.title}">
     <img th:src="@{${thumb}}" th:srcset="@{${thumb}}" sizes="(max-width: 680px) 50vw, 33vw" th:alt="${photo.title ?: '照片'}" loading="lazy" decoding="async" width="800" height="1000" />
    </a>
   </th:block>
  </th:block>
 </div>
 <dialog class="gallery-dialog" data-gallery-dialog aria-labelledby="gallery-title">
  <div class="gallery-toolbar">
   <h2 id="gallery-title" data-gallery-title>照片浏览</h2>
   <span class="gallery-counter" data-gallery-counter></span>
   <button type="button" class="gallery-icon-button" data-gallery-close aria-label="关闭照片">×</button>
  </div>
  <div class="gallery-stage" data-gallery-stage>
   <button type="button" class="gallery-arrow is-prev" data-gallery-prev aria-label="上一张照片">‹</button>
   <img class="gallery-image" data-gallery-image alt="" />
   <button type="button" class="gallery-arrow is-next" data-gallery-next aria-label="下一张照片">›</button>
  </div>
  <div class="gallery-controls">
   <span class="gallery-status" data-gallery-status role="status" aria-live="polite"></span>
   <button type="button" data-gallery-original>查看原图</button>
   <a data-gallery-open-original target="_blank" rel="noopener noreferrer">新窗口打开原图 ↗</a>
  </div>
  <details class="gallery-info" th:if="${theme.config?.gallery?.show_info != false}" open>
   <summary>照片信息</summary>
   <p data-gallery-note hidden></p>
   <dl>
    <div data-gallery-row="date" hidden><dt>拍摄日期</dt><dd data-gallery-field="date"></dd></div>
    <div data-gallery-row="location" hidden><dt>地点</dt><dd data-gallery-field="location"></dd></div>
    <div data-gallery-row="camera" hidden><dt>设备</dt><dd data-gallery-field="camera"></dd></div>
    <div><dt>当前图片</dt><dd data-gallery-dimensions></dd></div>
   </dl>
  </details>
 </dialog>
</section>
</body></html>
