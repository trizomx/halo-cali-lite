<!-- Generated by scripts/build-source.py; edit src/cali/projects.html -->
<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<!-- Port: projects/Projects.tsx + ProjectCard.tsx + components/ui/Card.tsx. -->
<section th:fragment="projects(compact)" class="source-projects" th:with="items=${theme.config?.projects?.items}, homeLimit=${theme.config?.projects?.home_limit ?: 3}">
 <ul role="list" class="source-project-list grid grid-cols-1 gap-x-12 gap-y-16 sm:grid-cols-2 lg:grid-cols-3" th:classappend="${compact} ? 'is-compact'" th:if="${items != null and not #lists.isEmpty(items)}">
  <th:block th:each="project, state : ${items}">
  <li class="source-project group relative flex flex-col items-start" th:if="${(not compact or state.index < homeLimit) and not #strings.isEmpty(project.name)}" data-project>
   <div class="relative z-10 flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-md shadow-zinc-800/5 ring-1 ring-zinc-900/5 dark:border dark:border-zinc-700/50 dark:bg-zinc-800 dark:ring-0">
    <img th:if="${not #strings.isEmpty(project.icon) and (project.icon.startsWith('https://') or project.icon.startsWith('/'))}" th:src="@{${project.icon}}" alt="" width="36" height="36" loading="lazy" class="h-9 w-9 rounded-full" />
    <span th:if="${#strings.isEmpty(project.icon) or not (project.icon.startsWith('https://') or project.icon.startsWith('/'))}" class="source-project-initial" aria-hidden="true" th:text="${#strings.substring(project.name,0,1)}"></span>
   </div>
   <h2 class="mt-6 text-base font-bold text-zinc-800 dark:text-zinc-100">
    <a th:if="${project.url != null and project.url.startsWith('https://')}" th:href="${project.url}" target="_blank" rel="noopener noreferrer"><span class="source-project-link absolute -inset-x-4 -inset-y-6 z-20 sm:-inset-x-6 sm:rounded-2xl"></span><span class="relative z-10" th:text="${project.name}"></span></a>
    <span th:unless="${project.url != null and project.url.startsWith('https://')}" th:text="${project.name}"></span>
   </h2>
   <p class="relative z-10 mt-2 text-sm text-zinc-600 dark:text-zinc-400" th:text="${project.description ?: ''}"></p>
   <p th:if="${project.url != null and project.url.startsWith('https://')}" class="pointer-events-none relative z-40 mt-6 flex items-center text-sm font-medium text-zinc-400 transition group-hover:-translate-y-0.5 group-hover:text-lime-600 dark:text-zinc-200 dark:group-hover:text-lime-400"><span class="mr-2 source-project-host" th:text="${project.url}"></span><svg class="h-4 w-4 flex-none" aria-hidden="true"><use href="#cali-ExternalLinkIcon"/></svg></p>
   <div class="source-project-wire" aria-hidden="true"><div class="source-project-wire-icon"></div><div class="source-project-wire-title" th:text="${project.name}"></div><p th:text="${project.description ?: ''}"></p></div>
  </li>
  </th:block>
 </ul>
 <p class="source-project-empty text-sm text-zinc-500" th:if="${items == null or #lists.isEmpty(items)}">项目正在整理中。</p>
</section>
</body></html>
