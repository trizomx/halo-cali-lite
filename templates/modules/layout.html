<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="html(viewContent, pageTitle, active, extraHead)" lang="zh-CN" th:lang="${site.language}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title th:if="${extraHead == null}" th:text="${pageTitle}"></title>
  <th:block th:if="${extraHead != null}"><th:block th:replace="${extraHead}"></th:block></th:block>
  <script th:src="@{/assets/theme-init.js(v=${theme.spec.version})}"></script>
  <link rel="stylesheet" th:href="@{/assets/style.css(v=${theme.spec.version})}" />
  <script defer th:src="@{/assets/main.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/navigation.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/avatar.js(v=${theme.spec.version})}"></script>
</head>
<body th:classappend="${active == 'home'} ? 'is-home'">
  <a class="skip-link" href="#main" th:text="#{skip}"></a>
  <div class="site-shell">
    <header class="site-header" data-sticky-header>
      <a class="brand" th:href="@{/}" th:aria-label="${site.title}">
        <span class="avatar-slot" data-avatar-slot>
          <span class="site-avatar" data-site-avatar th:if="${active != 'home'}">
            <img th:if="${not #strings.isEmpty(site.logo)}" th:src="@{${site.logo}}" alt="" width="38" height="38" />
            <span th:if="${#strings.isEmpty(site.logo)}" class="avatar-mark" aria-hidden="true">✳</span>
          </span>
        </span>
        <span class="brand-label" th:if="${active != 'home'}" th:text="${site.title}"></span>
      </a>
      <nav class="top-nav" data-top-nav th:aria-label="#{nav.label}">
    <span class="nav-spotlight" aria-hidden="true"></span>
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-item" th:href="@{/}" th:attr="aria-current=${active == 'home' ? 'page' : null}"><span th:text="#{nav.home}"></span></a>
    <a class="nav-item" th:href="@{${site.routes.archivesUri}}" th:attr="aria-current=${active == 'writing' ? 'page' : null}"><span th:text="#{nav.writing}"></span></a>
    <a class="nav-item" th:href="@{${site.routes.categoriesUri}}" th:attr="aria-current=${active == 'categories' ? 'page' : null}"><span th:text="#{nav.categories}"></span></a>
    <button type="button" class="nav-item" data-about-open aria-haspopup="dialog" aria-controls="about-dialog"><span th:text="#{nav.about}"></span></button>
    
    
  </nav>
      <div class="header-actions"><button class="round-button theme-toggle" type="button" th:aria-label="#{theme.toggle}" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></div>
    </header>
    <th:block th:replace="${viewContent}"></th:block>
    <footer class="site-footer" id="site-footer">
      <span>© <span data-current-year></span> <span th:text="${site.title}"></span></span>
      <span class="footer-note" th:text="#{footer.note}"></span>
    </footer>
  </div>
  
  <dialog class="about-dialog" id="about-dialog" aria-labelledby="about-title">
    <button type="button" class="round-button dialog-close" data-about-close th:aria-label="#{close}"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <span class="eyebrow" th:text="#{about.eyebrow}"></span>
    <h2 id="about-title" th:text="${site.title}"></h2>
    <p th:text="${theme.config?.home?.intro ?: site.subtitle ?: ''}"></p>
    <a class="text-link" th:href="@{${site.routes.archivesUri}}"><span th:text="#{about.read}"></span><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
  </dialog>
  <button type="button" class="back-top round-button" data-back-top th:aria-label="#{back.top}" hidden><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>
  <noscript><style>.theme-toggle,[data-about-open],[data-back-top]{display:none!important}</style></noscript>
  <halo:footer />
</body>
</html>
