<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="html(viewContent, pageTitle, active, extraHead)" lang="zh-CN" th:lang="${site.language}" th:with="allPages=${singlePageFinder.list(1,100)}, publicPages=${allPages.items.?[spec.publish == true and #strings.toString(spec.visible) == 'PUBLIC' and spec.deleted != true]},
 projectsPage=${not #strings.isEmpty(theme.config?.projects?.page_name) ? singlePageFinder.getByName(theme.config.projects.page_name) : (theme.config?.projects?.auto_page != false ? publicPages.^[spec.template == 'page_projects.html' or ((#strings.isEmpty(spec.template) or spec.template == 'page.html') and spec.slug == 'projects')] : null)},
 photosPage=${not #strings.isEmpty(theme.config?.gallery?.page_name) ? singlePageFinder.getByName(theme.config.gallery.page_name) : (theme.config?.gallery?.auto_page != false ? publicPages.^[spec.template == 'page_photos.html' or ((#strings.isEmpty(spec.template) or spec.template == 'page.html') and spec.slug == 'photos')] : null)},
 projectsReady=${projectsPage != null and projectsPage.spec.publish == true and #strings.toString(projectsPage.spec.visible) == 'PUBLIC' and projectsPage.spec.deleted != true and projectsPage.spec.template != 'page_photos.html'},
 photosReady=${photosPage != null and photosPage.spec.publish == true and #strings.toString(photosPage.spec.visible) == 'PUBLIC' and photosPage.spec.deleted != true and photosPage.spec.template != 'page_projects.html'},
 projectsUrl=${projectsReady ? projectsPage.status.permalink : null}, photosUrl=${photosReady ? photosPage.status.permalink : null},
 photosNav=${theme.config?.gallery?.enabled != false and theme.config?.gallery?.nav_enabled != false and photosReady},
 pageActive=${not #strings.isEmpty(active) ? active : (singlePage != null and projectsReady and singlePage.metadata.name == projectsPage.metadata.name ? 'projects' : (singlePage != null and photosReady and singlePage.metadata.name == photosPage.metadata.name ? 'photos' : ''))}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title th:if="${extraHead == null}" th:text="${pageTitle}"></title>
  <th:block th:if="${extraHead != null}"><th:block th:replace="${extraHead}"></th:block></th:block>
  <script th:src="@{/assets/appearance.js(v=${theme.spec.version})}" th:attr="data-light-background=${theme.config?.appearance?.light_background},data-dark-background=${theme.config?.appearance?.dark_background},data-light-accent=${theme.config?.appearance?.light_accent},data-dark-accent=${theme.config?.appearance?.dark_accent},data-nav-size=${theme.config?.appearance?.nav_font_size},data-indicator-height=${theme.config?.appearance?.indicator_height},data-grid=${theme.config?.appearance?.show_grid}"></script>
  <script th:src="@{/assets/theme-init.js(v=${theme.spec.version})}"></script>
  <link rel="stylesheet" th:href="@{/assets/style.css(v=${theme.spec.version})}" />
  <link rel="stylesheet" th:href="@{/assets/cali-source.css(v=${theme.spec.version})}" />
  <link th:if="${pageActive == 'photos'}" rel="stylesheet" th:href="@{/assets/gallery.css(v=${theme.spec.version})}" />
  <script th:if="${pageActive == 'photos'}" defer th:src="@{/assets/gallery.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/main.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/navigation.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/avatar.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/cards.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/source-post.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/source-navigation.js(v=${theme.spec.version})}"></script>
  <script defer th:src="@{/assets/source-projects.js(v=${theme.spec.version})}"></script>
</head>
<body class="cali-source" th:classappend="${pageActive == 'home'} ? 'is-home'">
  <a class="skip-link" href="#main" th:text="#{skip}"></a>
  <th:block th:replace="~{modules/source-icons :: icons}"></th:block>
  <div class="site-shell">
    <header class="site-header" data-sticky-header>
      <a class="brand" th:href="@{/}" th:aria-label="${site.title}">
        <span class="avatar-slot" data-avatar-slot>
          <span class="site-avatar" data-site-avatar th:if="${pageActive != 'home'}">
            <img th:if="${not #strings.isEmpty(site.logo)}" th:src="@{${site.logo}}" alt="" width="38" height="38" />
            <span th:if="${#strings.isEmpty(site.logo)}" class="avatar-mark" aria-hidden="true">✳</span>
          </span>
        </span>
        <span class="brand-label" th:if="${pageActive != 'home'}" th:text="${site.title}"></span>
      </a>
      <nav class="top-nav" data-top-nav th:aria-label="#{nav.label}">
    <span class="nav-spotlight" aria-hidden="true"></span>
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-item" th:href="@{/}" th:attr="aria-current=${pageActive == 'home' ? 'page' : null}"><span th:text="#{nav.home}"></span></a>
    <a class="nav-item" th:href="@{${site.routes.archivesUri}}" th:attr="aria-current=${pageActive == 'writing' ? 'page' : null}"><span th:text="#{nav.writing}"></span></a>
    <a class="nav-item" th:if="${photosNav}" th:href="@{${photosUrl}}" th:attr="aria-current=${pageActive == 'photos' ? 'page' : null}"><span>照片</span></a>
    <a class="nav-item" th:href="@{${site.routes.categoriesUri}}" th:attr="aria-current=${pageActive == 'categories' ? 'page' : null}"><span th:text="#{nav.categories}"></span></a>
    <a class="nav-item" th:if="${theme.config?.projects?.nav_enabled != false and projectsReady}" th:href="@{${projectsUrl}}" th:attr="aria-current=${pageActive == 'projects' ? 'page' : null}"><span>项目</span></a>
    <button type="button" class="nav-item" data-about-open aria-haspopup="dialog" aria-controls="about-dialog"><span th:text="#{nav.about}"></span></button>
    
    
  </nav>
      <div class="header-actions"><button class="round-button theme-toggle" type="button" th:aria-label="#{theme.toggle}" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></div>
    </header>
    <th:block th:replace="${viewContent}"></th:block>
    <div class="source-footer-subscribe" th:if="${theme.config?.newsletter?.show_footer != false}"><th:block th:replace="~{modules/source-newsletter :: newsletter(position='footer')}"></th:block></div>
    <footer class="site-footer" id="site-footer">
      <span>© <span data-current-year></span> <span th:text="${site.title}"></span></span>
      <nav th:if="${theme.config?.footer?.show_links != false}" class="source-footer-links" aria-label="页脚导航"><a th:href="@{/}">首页</a><a th:href="@{${site.routes.archivesUri}}">文章</a><a th:if="${projectsReady}" th:href="@{${projectsUrl}}">项目</a><a th:if="${photosNav}" th:href="@{${photosUrl}}">照片</a><a th:if="${theme.config?.footer?.show_source != false}" href="https://github.com/trizomx/halo-cali-lite" target="_blank" rel="noopener noreferrer">GitHub</a></nav>
      <span class="theme-version" data-theme-version aria-label="主题版本" th:if="${theme.config?.footer?.show_version != false}" th:text="|cali lite v${theme.spec.version}|"></span>
      <span th:if="${not #strings.isEmpty(theme.config?.footer?.text)}" th:text="${theme.config.footer.text}"></span>
    </footer>
  </div>
  
  <dialog class="about-dialog" id="about-dialog" aria-labelledby="about-title">
    <button type="button" class="round-button dialog-close" data-about-close th:aria-label="#{close}"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <span class="eyebrow" th:text="#{about.eyebrow}"></span>
    <h2 id="about-title" th:text="${site.title}"></h2>
    <p th:text="${theme.config?.home?.intro ?: site.subtitle ?: ''}"></p>
    <a class="text-link" th:href="@{${site.routes.archivesUri}}"><span th:text="#{about.read}"></span><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
  </dialog>
  <button type="button" class="back-top round-button" data-back-top th:aria-label="#{back.top}" hidden><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>
  <noscript><style>.theme-toggle,[data-about-open],[data-back-top]{display:none!important}</style></noscript>
  <th:block th:replace="~{modules/source-loading :: loading}"></th:block>
  <halo:footer />
</body>
</html>
