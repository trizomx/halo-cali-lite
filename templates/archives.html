<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=#{archive.title} + ' · ' + ${site.title}, active='writing', extraHead=null)}">
<main id="main" class="inner-page writing-page">
  <header class="page-heading"><span class="eyebrow">WRITING</span><h1 th:text="#{archive.title}"></h1><p th:text="#{archive.intro}"></p></header>
  <div class="article-card-grid" th:if="${not #lists.isEmpty(archives.items)}">
    <th:block th:each="archive : ${archives.items}">
      <th:block th:each="month : ${archive.months}">
        <th:block th:each="post : ${month.posts}">
          <article th:replace="~{modules/posts :: card(post=${post})}"></article>
        </th:block>
      </th:block>
    </th:block>
  </div>
  <div class="empty-state" th:if="${#lists.isEmpty(archives.items)}"><h2 th:text="#{empty.posts}"></h2><p th:text="#{empty.posts.note}"></p></div>
  <nav th:replace="~{modules/posts :: pagination(result=${archives})}"></nav>
</main></html>
