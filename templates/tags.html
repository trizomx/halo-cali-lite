<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=#{nav.tags} + ' · ' + ${site.title}, active='categories', extraHead=null)}">
<main id="main" class="inner-page"><header class="page-heading"><span class="eyebrow">EXPLORE</span><h1 th:text="#{nav.tags}"></h1></header><div class="collection-grid"><a class="collection-card" th:each="item : ${tags}" th:href="@{${item.status.permalink}}"><span class="collection-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r=".75"/></svg></span><h2 th:text="${item.spec.displayName}"></h2><span aria-hidden="true">↗</span></a></div><div class="empty-state" th:if="${#lists.isEmpty(tags)}"><h2 th:text="#{empty.collection}"></h2></div></main></html>
