<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{modules/layout :: html(viewContent=~{::main}, pageTitle=|${singlePage.spec.title} · ${site.title}|, active='photos', extraHead=null)}">
<!-- Page / wall structure adapted from cali.so v3, with the full cali lite
     content width requested by the user. See src/photos/sources.json. -->
<main id="main" class="photos-page inner-page">
 <header class="page-heading photos-heading">
  <span class="eyebrow">PHOTOS</span>
  <h1 th:text="${singlePage.spec.title}"></h1>
  <div class="photos-intro source-prose" th:if="${not #strings.isEmpty(singlePage.content?.content)}" th:utext="${singlePage.content.content}"></div>
 </header>
 <p class="photos-empty" data-gallery-empty th:hidden="${theme.config?.gallery?.enabled != false and theme.config?.gallery?.items != null and not #lists.isEmpty(theme.config.gallery.items)}">还没有发布照片。</p>
 <th:block th:replace="~{modules/gallery :: gallery}"></th:block>
 <noscript><style>.photo-wall-item img{aspect-ratio:auto}</style></noscript>
</main></html>
